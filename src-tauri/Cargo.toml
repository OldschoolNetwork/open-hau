[package]
name = "openhau"
version = "26.1.0"
description = "OpenHaU — House & Utilities"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
