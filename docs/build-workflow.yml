# Installation: copy this file to .github/workflows/build.yml using a GitHub
# session authorized to manage workflows. It is inert in docs/.
name: Build OpenHaU Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ''
          - os: macos-latest
            name: macos-universal-unsigned
            args: '--target universal-apple-darwin --config src-tauri/tauri.macos.conf.json'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.6'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHaU-26.1-Preview-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
