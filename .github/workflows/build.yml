name: Build OpenHaU
on:
  workflow_dispatch:
  push:
    branches: [main, development/26.2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ''
          - os: macos-latest
            name: macos-universal-adhoc
            args: '--target universal-apple-darwin --config src-tauri/tauri.macos.conf.json'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.6'
      - name: Verify macOS bundle signature and architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenHaU.app"
          test -x "$app/Contents/MacOS/openhau"
          codesign --verify --deep --strict --verbose=2 "$app"
          architectures=$(lipo -archs "$app/Contents/MacOS/openhau")
          echo "$architectures"
          [[ "$architectures" == *x86_64* && "$architectures" == *arm64* ]]
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHaU-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
